services:

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: cloud-efficiency-engine-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deployments/prometheus/recording-rules.yml:/etc/prometheus/recording-rules.yml:ro

  postgres:
    image: postgres:16
    container_name: cloud-efficiency-engine-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finops
    volumes:
      - cloud-efficiency-engine-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finops"]
      interval: 5s
      timeout: 5s
      retries: 10

  cloud-efficiency-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloud-efficiency-engine
    ports:
      - "8080:8080"
    environment:
      METRICS_PROVIDER: prometheus
      PROMETHEUS_URL: http://prometheus:9090
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/finops?sslmode=disable
      DB_MAX_CONNS: 10
      DB_MIN_CONNS: 2
    depends_on:
      prometheus:
        condition: service_started
      postgres:
        condition: service_healthy

volumes:
  cloud-efficiency-engine-postgres:
