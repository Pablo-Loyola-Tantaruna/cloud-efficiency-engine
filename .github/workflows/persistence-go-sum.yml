name: Persistence Go Sum Bootstrap

on:
  push:
    branches:
      - "feature/finops-persistence"

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Upload generated Go sum
        uses: actions/upload-artifact@v6
        with:
          name: persistence-go-sum
          path: go.sum
