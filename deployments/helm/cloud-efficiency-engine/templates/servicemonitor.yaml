{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "cloud-efficiency-engine.fullname" . }}
  namespace: monitoring
  labels:
    release: monitoring
    app: cloud-efficiency-engine
spec:
  namespaceSelector:
    matchNames:
      - {{ include "cloud-efficiency-engine.namespace" . }}

  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "cloud-efficiency-engine.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}

  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.monitoring.serviceMonitor.scrapeTimeout }}
      scheme: http

    - port: http
      path: /metrics/finops
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.monitoring.serviceMonitor.scrapeTimeout }}
      scheme: http
{{- end }}