{{- if and .Values.monitoring.enabled .Values.monitoring.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "cloud-efficiency-engine.fullname" . }}-alerts
  namespace: monitoring
  labels:
    release: monitoring
    app: cloud-efficiency-engine
spec:
  groups:
    - name: {{ include "cloud-efficiency-engine.fullname" . }}.alerts
      interval: {{ .Values.monitoring.prometheusRule.evaluationInterval }}
      rules:

        - alert: CloudEfficiencyAnalysisStale
          expr: |
            cee:analysis_stale == 1
          for: 10m
          labels:
            severity: warning
            category: observability
          annotations:
            summary: "Cloud Efficiency analysis is stale"
            description: "No successful scheduled analysis has completed for more than one hour."

        - alert: CloudEfficiencySchedulerFailures
          expr: |
            rate(
              cee_scheduler_failure_total[10m]
            ) > 0
          for: 5m
          labels:
            severity: warning
            category: application
          annotations:
            summary: "Cloud Efficiency scheduler is failing"
            description: "Scheduled analyses are currently failing."

        - alert: CloudEfficiencyCriticalRecommendations
          expr: |
            sum(
              cee_recommendation_severity_count{
                severity="CRITICAL"
              }
            ) >= 10
          for: 10m
          labels:
            severity: critical
            category: finops
          annotations:
            summary: "Critical optimization backlog detected"
            description: "The engine currently reports at least 10 critical recommendations."

        - alert: CloudEfficiencyHighSavingsOpportunity
          expr: |
            sum(
              cee_potential_savings_usd
            ) >= 1000
          for: 10m
          labels:
            severity: warning
            category: finops
          annotations:
            summary: "High savings opportunity detected"
            description: "The engine identified at least $1000 of estimated monthly savings."
  {{- end }}