{{- if and .Values.monitoring.enabled .Values.monitoring.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "cloud-efficiency-engine.fullname" . }}
  namespace: monitoring
  labels:
    release: monitoring
    app: cloud-efficiency-engine

spec:
  groups:

    # ==========================================================
    # Cloud Efficiency Engine application/business rules
    # ==========================================================

    - name: {{ include "cloud-efficiency-engine.fullname" . }}.recording
      interval: {{ .Values.monitoring.prometheusRule.evaluationInterval }}

      rules:

        - record: cee:analysis_success_rate
          expr: |
            (
              sum(
                cee_scheduler_success_total
              )
              /
              clamp_min(
                sum(
                  cee_scheduler_runs_total
                ),
                1
              )
            ) * 100

        - record: cee:analysis_failure_rate
          expr: |
            (
              sum(
                cee_scheduler_failure_total
              )
              /
              clamp_min(
                sum(
                  cee_scheduler_runs_total
                ),
                1
              )
            ) * 100

        - record: cee:http_requests_per_second
          expr: |
            sum(
              rate(
                cee_http_requests_total[5m]
              )
            )

        - record: cee:http_error_rate
          expr: |
            (
              sum(
                rate(
                  cee_http_requests_total{
                    status=~"5.."
                  }[5m]
                )
              )
              /
              clamp_min(
                sum(
                  rate(
                    cee_http_requests_total[5m]
                  )
                ),
                0.000001
              )
            ) * 100

        - record: cee:monthly_savings_percentage
          expr: |
            (
              sum(
                cee_potential_savings_usd
              )
              /
              clamp_min(
                sum(
                  cee_current_monthly_cost_usd
                ),
                0.000001
              )
            ) * 100

        - record: cee:analysis_stale
          expr: |
            (
              time()
              -
              cee_scheduler_last_success_timestamp
            ) > 3600

        - record: cee:optimization_coverage_percentage
          expr: |
            (
              sum(
                cee_workload_optimizable
              )
              /
              clamp_min(
                sum(
                  cee_workload_count
                ),
                1
              )
            ) * 100

    # ==========================================================
    # Kubernetes workload ownership and resource metrics
    #
    # Pod -> ReplicaSet -> Deployment
    # ==========================================================

    - name: {{ include "cloud-efficiency-engine.fullname" . }}.kubernetes-workload
      interval: {{ .Values.monitoring.prometheusRule.evaluationInterval }}

      rules:

        - record: cee_workload_pod_owner
          expr: |
            max by (
              namespace,
              workload,
              pod
            ) (
              label_replace(
                label_replace(
                  kube_pod_owner{
                    owner_kind="ReplicaSet"
                  },
                  "replicaset",
                  "$1",
                  "owner_name",
                  "(.*)"
                )
                *
                on(
                  namespace,
                  replicaset
                )
                group_left(
                  owner_name
                )
                topk by (
                  namespace,
                  replicaset
                ) (
                  1,
                  max by (
                    namespace,
                    replicaset,
                    owner_name
                  ) (
                    kube_replicaset_owner{
                      owner_kind="Deployment"
                    }
                  )
                ),
                "workload",
                "$1",
                "owner_name",
                "(.*)"
              )
            )

        - record: cee_workload_cpu_request_millicores
          expr: |
            1000 *
            sum by (
              namespace,
              workload
            ) (
              (
                sum by (
                  namespace,
                  pod
                ) (
                  kube_pod_container_resource_requests{
                    resource="cpu",
                    unit="core",
                    container!="POD"
                  }
                )
              )
              *
              on(
                namespace,
                pod
              )
              group_left(
                workload
              )
              cee_workload_pod_owner
            )

        - record: cee_workload_cpu_usage_millicores
          expr: |
            1000 *
            sum by (
              namespace,
              workload
            ) (
              (
                sum by (
                  namespace,
                  pod
                ) (
                  rate(
                    container_cpu_usage_seconds_total{
                      container!="",
                      container!="POD",
                      image!=""
                    }[5m]
                  )
                )
              )
              *
              on(
                namespace,
                pod
              )
              group_left(
                workload
              )
              cee_workload_pod_owner
            )

        - record: cee_workload_memory_request_bytes
          expr: |
            sum by (
              namespace,
              workload
            ) (
              (
                sum by (
                  namespace,
                  pod
                ) (
                  kube_pod_container_resource_requests{
                    resource="memory",
                    unit="byte",
                    container!="POD"
                  }
                )
              )
              *
              on(
                namespace,
                pod
              )
              group_left(
                workload
              )
              cee_workload_pod_owner
            )

        - record: cee_workload_memory_usage_bytes
          expr: |
            sum by (
              namespace,
              workload
            ) (
              (
                sum by (
                  namespace,
                  pod
                ) (
                  container_memory_working_set_bytes{
                    container!="",
                    container!="POD",
                    image!=""
                  }
                )
              )
              *
              on(
                namespace,
                pod
              )
              group_left(
                workload
              )
              cee_workload_pod_owner
            )

        - record: cee_workload_replicas
          expr: |
            label_replace(
              kube_deployment_spec_replicas,
              "workload",
              "$1",
              "deployment",
              "(.*)"
            )

{{- end }}