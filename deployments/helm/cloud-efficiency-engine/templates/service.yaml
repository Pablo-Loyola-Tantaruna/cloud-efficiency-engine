apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloud-efficiency-engine.serviceName" . }}
  namespace: {{ include "cloud-efficiency-engine.namespace" . }}
  labels:
    {{- include "cloud-efficiency-engine.labels" . | nindent 4 }}
    monitoring: enabled
spec:
  type: {{ .Values.service.type }}

  selector:
    {{- include "cloud-efficiency-engine.selectorLabels" . | nindent 4 }}

  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP