global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/recording-rules.yml
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: cloud-efficiency-engine-http
    metrics_path: /metrics
    static_configs:
      - targets:
          - cloud-efficiency-engine:8080

  - job_name: cloud-efficiency-engine-finops
    metrics_path: /metrics/finops
    static_configs:
      - targets:
          - cloud-efficiency-engine:8080
