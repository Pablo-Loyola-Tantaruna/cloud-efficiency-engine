apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cloud-efficiency-engine
  namespace: monitoring
  labels:
    release: monitoring
    app.kubernetes.io/name: cloud-efficiency-engine
    app.kubernetes.io/part-of: cloud-efficiency-engine
spec:
  groups:
    - name: cloud-efficiency-engine.workloads
      interval: 30s

      rules:

        # ============================================================
        # Pod -> ReplicaSet -> Deployment
        #
        # Result:
        #
        # namespace          workload        pod
        # cloud-efficiency   payments-api    payments-api-xxxxx
        #
        # cloud-efficiency   orders-api      orders-api-xxxxx
        # ============================================================

        - record: cee:pod_workload:owner
          expr: |
            max by (namespace, workload, pod) (
              label_replace(
                kube_pod_owner{
                  owner_kind="ReplicaSet"
                },
                "replicaset",
                "$1",
                "owner_name",
                "(.*)"
              )
              *
              on(namespace, replicaset)
              group_left(workload)
              label_replace(
                kube_replicaset_owner{
                  owner_kind="Deployment"
                },
                "workload",
                "$1",
                "owner_name",
                "(.*)"
              )
            )

        # ============================================================
        # CPU REQUEST
        #
        # Kubernetes exposes CPU requests as CPU cores.
        # CEE exposes millicores.
        #
        # Example:
        #
        # payments-api:
        # 3 replicas * 1 core = 3000m
        #
        # orders-api:
        # 2 replicas * 0.5 core = 1000m
        # ============================================================

        - record: cee_workload_cpu_request_millicores
          expr: |
            sum by (namespace, workload) (
              kube_pod_container_resource_requests{
                resource="cpu",
                unit="core",
                container!="",
                container!="POD"
              }
              *
              on(namespace, pod)
              group_left(workload)
              cee:pod_workload:owner
            ) * 1000

        # ============================================================
        # CPU USAGE
        #
        # container_cpu_usage_seconds_total is a counter.
        #
        # rate()[5m]
        #       ->
        # CPU cores
        #
        # * 1000
        #       ->
        # millicores
        # ============================================================

        - record: cee_workload_cpu_usage_millicores
          expr: |
            sum by (namespace, workload) (
              rate(
                container_cpu_usage_seconds_total{
                  container!="",
                  container!="POD",
                  image!=""
                }[5m]
              )
              *
              on(namespace, pod)
              group_left(workload)
              cee:pod_workload:owner
            ) * 1000

        # ============================================================
        # MEMORY REQUEST
        # ============================================================

        - record: cee_workload_memory_request_bytes
          expr: |
            sum by (namespace, workload) (
              kube_pod_container_resource_requests{
                resource="memory",
                unit="byte",
                container!="",
                container!="POD"
              }
              *
              on(namespace, pod)
              group_left(workload)
              cee:pod_workload:owner
            )

        # ============================================================
        # MEMORY USAGE
        # ============================================================

        - record: cee_workload_memory_usage_bytes
          expr: |
            sum by (namespace, workload) (
              container_memory_working_set_bytes{
                container!="",
                container!="POD",
                image!=""
              }
              *
              on(namespace, pod)
              group_left(workload)
              cee:pod_workload:owner
            )

        # ============================================================
        # REPLICAS
        # ============================================================

        - record: cee_workload_replicas
          expr: |
            label_replace(
              kube_deployment_spec_replicas,
              "workload",
              "$1",
              "deployment",
              "(.*)"
            )