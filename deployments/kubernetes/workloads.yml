apiVersion: apps/v1
kind: Deployment

metadata:
  name: payments-api
  namespace: cloud-efficiency-engine

  labels:
    app: payments-api
    app.kubernetes.io/part-of: cloud-efficiency-engine-demo

spec:

  replicas: 3

  selector:
    matchLabels:
      app: payments-api

  template:

    metadata:
      labels:
        app: payments-api

    spec:

      containers:

        - name: payments-api

          image: nginx:1.27-alpine

          resources:

            requests:
              cpu: "1000m"
              memory: "1Gi"

            limits:
              cpu: "2000m"
              memory: "2Gi"

          ports:
            - containerPort: 80

---

apiVersion: apps/v1
kind: Deployment

metadata:
  name: orders-api
  namespace: cloud-efficiency-engine

  labels:
    app: orders-api
    app.kubernetes.io/part-of: cloud-efficiency-engine-demo

spec:

  replicas: 2

  selector:
    matchLabels:
      app: orders-api

  template:

    metadata:
      labels:
        app: orders-api

    spec:

      containers:

        - name: orders-api

          image: nginx:1.27-alpine

          resources:

            requests:
              cpu: "500m"
              memory: "1Gi"

            limits:
              cpu: "1000m"
              memory: "2Gi"

          ports:
            - containerPort: 80