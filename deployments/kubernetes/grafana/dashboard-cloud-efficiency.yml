apiVersion: v1
kind: ConfigMap
metadata:
  name: cloud-efficiency-engine-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  cloud-efficiency-engine.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "type": "stat",
          "title": "Current Monthly Cost",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum(cee_current_monthly_cost_usd)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "decimals": 2
            }
          }
        },
        {
          "type": "stat",
          "title": "Optimized Monthly Cost",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum(cee_optimized_monthly_cost_usd)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "decimals": 2
            }
          }
        },
        {
          "type": "stat",
          "title": "Potential Monthly Savings",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum(cee_potential_savings_usd)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "decimals": 2
            }
          }
        },
        {
          "type": "stat",
          "title": "Savings Opportunity",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "targets": [
            {
              "expr": "cee:monthly_savings_percentage",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 2
            }
          }
        },
        {
          "type": "stat",
          "title": "Workloads",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 5
          },
          "targets": [
            {
              "expr": "sum(cee_workload_count)",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Optimizable Workloads",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 5
          },
          "targets": [
            {
              "expr": "sum(cee_optimizable_workload_count)",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Scheduler Success Rate",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 12,
            "y": 5
          },
          "targets": [
            {
              "expr": "cee:analysis_success_rate",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 2
            }
          }
        },
        {
          "type": "stat",
          "title": "HTTP Error Rate",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 18,
            "y": 5
          },
          "targets": [
            {
              "expr": "cee:http_error_rate",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 2
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Potential Savings by Namespace",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 10
          },
          "targets": [
            {
              "expr": "cee_potential_savings_usd",
              "legendFormat": "{{namespace}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "decimals": 2
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Savings Percentage by Namespace",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 10
          },
          "targets": [
            {
              "expr": "cee_savings_percentage",
              "legendFormat": "{{namespace}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 2
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Scheduler Runs",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 18
          },
          "targets": [
            {
              "expr": "rate(cee_scheduler_runs_total[5m])",
              "legendFormat": "{{namespace}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Scheduler Duration",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 18
          },
          "targets": [
            {
              "expr": "cee_scheduler_last_duration_seconds",
              "legendFormat": "{{namespace}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 3
            }
          }
        },
        {
          "type": "table",
          "title": "Top Savings Opportunities",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 26
        },
        "targets": [
        {
            "expr": "topk(10, cee_workload_potential_savings_usd)",
            "format": "table",
            "instant": true,
            "refId": "A"
        }
    ]
    },
    {
      "type": "table",
      "title": "Most Expensive Workloads",
      "gridPos": {
        "h": 8,
        "w": 12,
        "x": 12,
        "y": 26
      },
      "targets": [
        {
          "expr": "topk(10, cee_workload_current_monthly_cost_usd)",
          "format": "table",
          "instant": true,
          "refId": "A"
        }
      ]
    }
      ],
      "schemaVersion": 39,
      "tags": [
        "cloud-efficiency-engine",
        "finops",
        "kubernetes",
        "cost-optimization"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "title": "Cloud Efficiency Engine",
      "uid": "cloud-efficiency-engine",
      "version": 1
    }