apiVersion: v1
kind: ConfigMap
metadata:
  name: cloud-efficiency-engine-dashboard-provider
  namespace: monitoring
data:
  provider.yaml: |
    apiVersion: 1

    providers:
      - name: cloud-efficiency-engine
        orgId: 1
        folder: Cloud Efficiency Engine
        type: file
        disableDeletion: false
        allowUiUpdates: true
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards/cloud-efficiency-engine